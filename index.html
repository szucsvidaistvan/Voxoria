<!doctype html>
<html lang="hu">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0e1a33" />
  <title>Kockavilág</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600&display=swap" rel="stylesheet" />
</head>
<body>
  <canvas id="game"></canvas>

  <div id="hud" hidden>
    <div id="crosshair"></div>
    <div id="hotbar"></div>
    <button id="btn-menu" class="touch-only" type="button">Menü</button>
    <div id="joy" class="touch-only"><div id="joy-knob"></div></div>
    <div id="touch-actions" class="touch-only">
      <button id="btn-break" type="button">Bont</button>
      <button id="btn-place" type="button">Épít</button>
      <button id="btn-jump" type="button">Ugrás</button>
    </div>
  </div>

  <main id="menu">
    <h1>Kockavilág</h1>
    <p class="lead">Építs, ásj, fedezd fel a végtelen kockavilágot.</p>

    <button id="btn-continue" class="btn" type="button" hidden>Folytatás</button>
    <button id="btn-new" class="btn" type="button">Új világ</button>
    <button id="btn-settings" class="btn" type="button" aria-expanded="false" aria-controls="settings">Beállítások</button>

    <section id="settings" hidden>
      <label for="set-dist">Látótávolság: <output id="set-dist-val"></output> chunk</label>
      <input id="set-dist" type="range" min="3" max="10" step="1" />
      <label for="set-sens">Nézés érzékenysége</label>
      <input id="set-sens" type="range" min="0.4" max="2.5" step="0.1" />
    </section>

    <p id="controls" class="hint"></p>
    <p id="pack-note" class="hint" hidden>A textúracsomag nincs kicsomagolva, ezért egyszerű színekkel fut a játék. Lásd a README-t.</p>
  </main>

  <script type="module" src="/src/client/main.ts"></script>
</body>
</html>
